services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orchestrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orchestrator"]
      interval: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/orchestrator
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
